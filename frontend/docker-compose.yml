services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tickets-front
    ports:
      - '8080:80'
    environment:
      # Origen del backend Ticketing (sin slash final). Por defecto, el backend
      # corriendo en el host (app_tickets compose expone :8001). En una red compose
      # compartida usa el nombre del servicio, p.ej. http://ticketing:8000.
      API_BACKEND: ${API_BACKEND:-http://host.docker.internal:8001}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
